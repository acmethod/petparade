<!DOCTYPE HTML>
<html>
  <head>
    <title>Multiverse by HTML5 UP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
  </head>
  <body class="is-preload">

    <!-- Upload Form (SAFE ZONE — outside Multiverse wrapper) -->
    <section id="upload" style="padding: 2rem;">
      <h2>Upload Your Pet Pic</h2>
     <form id="uploadForm">
        <input type="text" id="petName" placeholder="Pet Name" required>

        <label for="category" style="display:block; margin-bottom:0.5rem; color:#fff;">Category</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Select a Category</option>
          <option>Best Dressed</option>
          <option>Caught in the Act</option>
          <option>Most Photogenic</option>
          <option>Best Friends</option>
          <option>I want Cuddles and Treats</option>
          <option>Best Coworker</option>
          <option>Sleeping Beauty</option>
        </select>

        <input type="email" id="ownerEmail" placeholder="Your Email" required>
        <input type="file" id="petImage" accept="image/*" required>

        <button type="submit" id="uploadButton" class="button primary upload">Upload</button>
      </form>
    </section>

    <!-- Wrapper -->
    <div id="wrapper">

      <!-- Header -->
      <header id="header">
        <h1><a href="index.html"><strong>Multiverse</strong> by HTML5 UP</a></h1>
        <nav>
          <ul>
            <li><a href="#footer" class="icon solid fa-info-circle">About</a></li>
          </ul>
        </nav>
      </header>

      <!-- Main -->
      <div id="main"></div>

      <!-- Footer -->
      <footer id="footer" class="panel">
        <!-- (unchanged footer content) -->
      </footer>

    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    <script src="app.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.poptrox.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>

  </body>
</html>
